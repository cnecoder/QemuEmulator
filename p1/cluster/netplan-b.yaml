# 设备 B 网络自配置（烘入 disk-b）
network:
  version: 2
  ethernets:
    enp0s1:
      dhcp4: true
    enp0s3:
      addresses: [10.0.101.2/24]
      routes:
        - {to: 10.0.100.0/24, via: 10.0.101.3}
        - {to: 10.0.102.0/24, via: 10.0.101.3}
    enp0s4:
      addresses: [10.0.201.2/24]
      routes:
        - {to: 10.0.200.0/24, via: 10.0.201.3}
        - {to: 10.0.202.0/24, via: 10.0.201.3}
