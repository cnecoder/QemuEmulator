# p2 四容器集群（独立版，路线甲）
#
# 网络设计（路线甲）：
#   docker 网段 10.9.x.0/24 仅为编排簿记地址（docker 不认识真实段 IP → 不生成 raw 表闸门，
#   宿主防火墙零改动，无需 fix-firewall）；真实段 IP（10.0.100~202.x）由容器内手工配置：
#   - router-setup.sh: 六腿真实 IP（网关职能）+ ifb 双向损伤接线 + 损伤控制守护
#   - server-setup.sh: 10.0.102.2 / 10.0.202.2 + 回程路由 + relay
#   - guest: seed ISO 携带 netplan（开机自配置链路 IP / 明细路由）
#
# path1: seg-a1(seg-b1)(seg-s1) —— 设备 A/B 的 link1 网卡与 server 经 router 互联
# path2: seg-a2(seg-b2)(seg-s2) —— 同构第二路径（双链路冗余）
#
# 环境变量（由 up.sh 导出）: P2_DIR HOST_UID HOST_GID
name: p2cluster
services:
  router:
    container_name: p2-router
    build:
      context: .
      dockerfile: Dockerfile.router
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      - STRICT_HUB=${STRICT_HUB:-0}     # 1=禁 A↔B 直通转发（互传强制只走 server）
      - P2_DIR=${P2_DIR}
    volumes:
      - ${P2_DIR}:${P2_DIR}
    networks:
      seg-a1: {ipv4_address: 10.9.1.3}
      seg-s1: {ipv4_address: 10.9.3.3}
      seg-b1: {ipv4_address: 10.9.2.3}
      seg-a2: {ipv4_address: 10.9.4.3}
      seg-s2: {ipv4_address: 10.9.6.3}
      seg-b2: {ipv4_address: 10.9.5.3}

  server:
    container_name: p2-server
    build:
      context: .
      dockerfile: Dockerfile.server
    cap_add: [NET_ADMIN]
    environment:
      - P2_DIR=${P2_DIR}
    volumes:
      - ${P2_DIR}:${P2_DIR}
    networks:
      seg-s1: {ipv4_address: 10.9.3.2}
      seg-s2: {ipv4_address: 10.9.6.2}

  vm-a:
    container_name: p2-vm-a
    build:
      context: .
      dockerfile: Dockerfile.vm
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [router, server]
    working_dir: ${P2_DIR}
    command: ["bash", "${P2_DIR}/cluster/entrypoint-vm.sh"]
    environment:
      - P2_DIR=${P2_DIR}
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - ROLE=a
      - SEED=${P2_DIR}/seed/seed-a.iso
      - DISK=${P2_DIR}/run/disk-a.qcow2
      - SEG_L1=10.9.1.
      - SEG_L2=10.9.4.
      - MGMT_MAC=52:54:00:12:34:56
      - L1_MAC=52:54:00:a1:00:01
      - L2_MAC=52:54:00:a2:00:01
    volumes:
      - ${P2_DIR}:${P2_DIR}
    networks:
      seg-a1: {ipv4_address: 10.9.1.10}
      seg-a2: {ipv4_address: 10.9.4.10}

  vm-b:
    container_name: p2-vm-b
    build:
      context: .
      dockerfile: Dockerfile.vm
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    depends_on: [router, server]
    working_dir: ${P2_DIR}
    command: ["bash", "${P2_DIR}/cluster/entrypoint-vm.sh"]
    environment:
      - P2_DIR=${P2_DIR}
      - HOST_UID=${HOST_UID}
      - HOST_GID=${HOST_GID}
      - ROLE=b
      - SEED=${P2_DIR}/seed/seed-b.iso
      - DISK=${P2_DIR}/run/disk-b.qcow2
      - SEG_L1=10.9.2.
      - SEG_L2=10.9.5.
      - MGMT_MAC=52:54:00:12:34:66
      - L1_MAC=52:54:00:b1:00:01
      - L2_MAC=52:54:00:b2:00:01
    volumes:
      - ${P2_DIR}:${P2_DIR}
    networks:
      seg-b1: {ipv4_address: 10.9.2.10}
      seg-b2: {ipv4_address: 10.9.5.10}

networks:
  seg-a1:
    ipam: {config: [{subnet: 10.9.1.0/24}]}
  seg-b1:
    ipam: {config: [{subnet: 10.9.2.0/24}]}
  seg-s1:
    ipam: {config: [{subnet: 10.9.3.0/24}]}
  seg-a2:
    ipam: {config: [{subnet: 10.9.4.0/24}]}
  seg-b2:
    ipam: {config: [{subnet: 10.9.5.0/24}]}
  seg-s2:
    ipam: {config: [{subnet: 10.9.6.0/24}]}
